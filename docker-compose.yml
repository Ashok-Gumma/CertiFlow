version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: certiflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: certiflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certiflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: certiflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiflow_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword2026@postgres:5432/certiflow?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: certiflow_super_secret_production_jwt_key_2026
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:5000
      WHATSAPP_FAILURE_RATE: 0.1
      WHATSAPP_TIMEOUT_RATE: 0.05
      MAX_DELIVERY_RETRIES: 3
      OVERDUE_BATCH_HOURS: 24
      UPLOAD_DIR: ./uploads
    volumes:
      - certificates_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiflow_worker
    restart: unless-stopped
    command: ["node", "dist/workers/index.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword2026@postgres:5432/certiflow?schema=public
      REDIS_URL: redis://redis:6379
      WHATSAPP_FAILURE_RATE: 0.1
      WHATSAPP_TIMEOUT_RATE: 0.05
      MAX_DELIVERY_RETRIES: 3
      UPLOAD_DIR: ./uploads
    volumes:
      - certificates_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: certiflow_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  certificates_data:
